[tool.poetry]
name = "jalali-calendar-cli"
version = "0.1.9"
description = "Jalali (Shamsi) calendar in your terminal, with holidays"
authors = ["NightMachinery <feraidoonmehri@gmail.com>"]
readme = "readme.org"
packages = [{include = "jalali_calendar_cli"}]


[tool.poetry.scripts]
jcal = 'jalali_calendar_cli.jalali_calendar:main'
jalali-calendar = 'jalali_calendar_cli.jalali_calendar:main'
jcal-all = 'jalali_calendar_cli.commands:jcal_all'
gcal = 'jalali_calendar_cli.commands:gcal'
gcal-lmu = 'jalali_calendar_cli.commands:gcal_lmu'
gcal-lmu-all = 'jalali_calendar_cli.commands:gcal_lmu_all'
gcal-lmu-iran = 'jalali_calendar_cli.commands:gcal_lmu_iran'
gcal-lmu-iran-all = 'jalali_calendar_cli.commands:gcal_lmu_iran_all'
jcal-iran-lmu = 'jalali_calendar_cli.commands:jcal_iran_lmu'
jcal-iran-lmu-all = 'jalali_calendar_cli.commands:jcal_iran_lmu_all'
jcal-html = 'jalali_calendar_cli.html_page:main'


[tool.poetry.dependencies]
python = "^3.10"
jdatetime = "^4.1.1"
colorama = "^0.4.6"
holidays = ">=0.106"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
